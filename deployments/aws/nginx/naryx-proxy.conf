# /etc/nginx/snippets/naryx-proxy.conf: shared proxy settings for the Naryx API locations.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Each location sets proxy_read_timeout itself: chain reads answer within 60s, while a queued
# Hyperliquid execution may wait for the shared account (the API bounds it at 120s).
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_buffering off;
proxy_hide_header X-Powered-By;
