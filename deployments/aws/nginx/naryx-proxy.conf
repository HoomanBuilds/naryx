# /etc/nginx/snippets/naryx-proxy.conf: shared proxy settings for the Naryx API locations.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Each location sets proxy_read_timeout itself: terminal requests that wait on chain writes need
# up to 130s, while the health check answers at once.
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_buffering off;
proxy_hide_header X-Powered-By;
