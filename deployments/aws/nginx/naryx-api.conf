# nginx site for the Naryx API host: /etc/nginx/sites-available/naryx-api.conf
# Replace api.naryx.example with the API hostname, then obtain the certificate with
#   sudo certbot --nginx -d api.naryx.example
# certbot adds the ssl_certificate lines and the HTTP-to-HTTPS redirect.
#
# Only the browser routes are forwarded. Every request nginx forwards reaches the API from
# 127.0.0.1, and the API admits solver, keeper, and executor routes (/internal/solver/,
# /internal/keeper/, recovery and coordination routes) from loopback peers only, so forwarding
# any other path would expose them to the internet. Everything not listed returns 404.

# Per-IP limits: reads and setup polling, and the stricter write routes. They are generous because
# many users can share one IP (a venue or office network); they stop floods, not normal trading.
limit_req_zone $binary_remote_addr zone=naryx_read:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=naryx_write:10m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name api.naryx.example;

    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Refuse raw paths a backend URL parser could resolve differently from nginx: backslashes,
    # encoded dots, slashes, or backslashes, and dot segments. No Naryx route uses any of them.
    if ($request_uri ~* "(\\\\|%5c|%2e|%2f|/\.\.?(/|\?|$))") {
        return 400;
    }

    location = /internal/healthz {
        limit_req zone=naryx_read burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/naryx-proxy.conf;
    }

    # Order creation, quotes, preparation, and execution handoffs: writes and chain work.
    location ~ ^/internal/terminal/(orders|execution/|evm-testnet/prepare|arbitrum-sepolia/(authorize-owner|prepare-owner-authorization)|hyperliquid-testnet/execute|solana-devnet/exit-order) {
        limit_req zone=naryx_write burst=40 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/naryx-proxy.conf;
    }

    # A plain prefix (not ^~), so the write-route regex above takes precedence for its paths.
    location /internal/terminal/ {
        limit_req zone=naryx_read burst=100 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/naryx-proxy.conf;
    }

    # Optional public v1 market API (NARYX_PUBLIC_MARKET_ENABLED=true, NARYX_PUBLIC_API_PORT=8790).
    # It serves reads only and runs its own per-client limit; uncomment to expose it on this host.
    # location ^~ /v1/ {
    #     limit_req zone=naryx_read burst=40 nodelay;
    #     proxy_pass http://127.0.0.1:8790;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     include /etc/nginx/snippets/naryx-proxy.conf;
    # }

    location / {
        return 404;
    }
}
