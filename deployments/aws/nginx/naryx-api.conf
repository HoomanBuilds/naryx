# nginx site for the Naryx API host: /etc/nginx/sites-available/naryx-api.conf
# Replace api.naryx.example with the API hostname, then obtain the certificate with
#   sudo certbot --nginx -d api.naryx.example
# certbot adds the ssl_certificate lines and the HTTP-to-HTTPS redirect.
#
# Only the browser routes are forwarded. Every request nginx forwards reaches the API from
# 127.0.0.1, and the API admits solver, keeper, and executor routes (/internal/solver/,
# /internal/keeper/, recovery and coordination routes) from loopback peers only, so forwarding
# any other path would expose them to the internet. Everything not listed returns 404.

# Per-IP limits: every request counts against the read limit, and every write (any method other
# than GET, HEAD, or OPTIONS: order creation, quotes, preparation, signatures, execution) also counts
# against the stricter write limit, so a new route is limited correctly without editing this file.
# The status reads the terminal polls while a package executes are POSTs that change nothing, so
# they count as reads; otherwise a few users behind one address would be throttled mid-execution.
# The limits are generous because many users can share one IP (a venue or office network); they
# stop floods, not normal trading.
map "$request_method:$uri" $naryx_write_key {
    ~^(GET|HEAD|OPTIONS): "";
    ~^POST:/internal/terminal/(hyperliquid-testnet/attempt-status|execution/observe|evm-testnet/observe-atomic|evm-testnet/observe-async)$ "";
    default $binary_remote_addr;
}
map $http_upgrade $naryx_connection_upgrade {
    default upgrade;
    "" close;
}
limit_req_zone $binary_remote_addr zone=naryx_read:10m rate=30r/s;
limit_req_zone $naryx_write_key zone=naryx_write:10m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name api.naryx.example;

    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Refuse raw paths a backend URL parser could resolve differently from nginx: backslashes,
    # encoded dots, slashes, or backslashes, and dot segments. No Naryx route uses any of them.
    if ($request_uri ~* "(\\\\|%5c|%2e|%2f|/\.\.?(/|\?|$))") {
        return 400;
    }

    location = /internal/healthz {
        limit_req zone=naryx_read burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/naryx-proxy.conf;
        proxy_read_timeout 60s;
    }

    # Some terminal requests wait on chain writes: a Solana Devnet binding finalizes two transactions
    # and a Hyperliquid execution may queue behind the shared account (the API bounds it at 120s).
    location /internal/terminal/ {
        limit_req zone=naryx_read burst=100 nodelay;
        limit_req zone=naryx_write burst=40 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/naryx-proxy.conf;
        proxy_read_timeout 130s;
    }

    # Public v1 market API on its own listener (NARYX_PUBLIC_MARKET_ENABLED=true,
    # NARYX_PUBLIC_API_PORT=8790, set by the Hyperliquid release). It serves market reads, the
    # /v1/stream WebSocket, and owner-signed package-book, RFQ, and sealed-auction writes, and also
    # runs its own per-client limit. Without the public market the listener is closed and these
    # paths answer 502; remove this block on a host that never runs it.
    location ^~ /v1/ {
        limit_req zone=naryx_read burst=60 nodelay;
        limit_req zone=naryx_write burst=20 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $naryx_connection_upgrade;
        include /etc/nginx/snippets/naryx-proxy.conf;
        proxy_read_timeout 130s;
    }

    location / {
        return 404;
    }
}
