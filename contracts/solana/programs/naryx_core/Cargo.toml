[package]
name = "naryx_core"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "naryx_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
conformance = [
    "dep:naryx_conformance_venue",
    "anchor-spl/idl-build",
    "naryx_conformance_venue/idl-build",
]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "=1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.0", features = ["token"] }
naryx_conformance_venue = { path = "../naryx_conformance_venue", features = ["cpi"], optional = true }
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
solana-instructions-sysvar = "=3.0.1"
solana-sdk-ids = "=3.1.0"

[dev-dependencies]
litesvm = { version = "=0.10.0", features = ["precompiles"] }
solana-message = "=3.1.0"
solana-transaction = "=3.1.0"
solana-signer = "=3.0.1"
solana-keypair = "=3.1.2"
solana-ed25519-program = "=3.0.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
