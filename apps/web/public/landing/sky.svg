<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1436"/>
      <stop offset="0.4" stop-color="#47288a"/>
      <stop offset="0.75" stop-color="#7f45c9"/>
      <stop offset="1" stop-color="#a964dc"/>
    </linearGradient>
    <radialGradient id="dawn" cx="0.84" cy="0.52" r="0.6">
      <stop offset="0" stop-color="#ffe2f6" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff9ae4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff9ae4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.12" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="cloud-bank">
      <rect width="1600" height="1000" fill="url(#lower)"/>
    </mask>
    <!-- Clouds: fractal noise thresholded into billows, tinted from violet to pale pink, over a darker copy dropped below as their shadow. -->
    <filter id="clouds" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0021 0.0034" numOctaves="5" seed="8" result="noise"/>
      <feColorMatrix in="noise" values="0 0.7 0 0 0.36  0 0.62 0 0 0.24  0 0.4 0 0 0.6  5 0 0 0 -2.15" result="lit"/>
      <feColorMatrix in="noise" values="0 0 0 0 0.16  0 0 0 0 0.08  0 0 0 0 0.32  4 0 0 0 -1.6" result="shade"/>
      <feOffset in="shade" dy="26" result="dropped"/>
      <feGaussianBlur in="dropped" stdDeviation="8" result="under"/>
      <feMerge>
        <feMergeNode in="under"/>
        <feMergeNode in="lit"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#air)"/>
  <rect width="1600" height="1000" fill="url(#dawn)"/>
  <g fill="#f8f8ff">
    <circle cx="212" cy="96" r="1.6" opacity="0.8"/>
    <circle cx="488" cy="58" r="1.2" opacity="0.6"/>
    <circle cx="742" cy="134" r="1.8" opacity="0.7"/>
    <circle cx="1036" cy="72" r="1.3" opacity="0.8"/>
    <circle cx="1288" cy="118" r="1.6" opacity="0.6"/>
    <circle cx="1490" cy="44" r="1.2" opacity="0.7"/>
    <circle cx="372" cy="178" r="1.1" opacity="0.5"/>
    <circle cx="902" cy="196" r="1.2" opacity="0.5"/>
    <circle cx="1188" cy="230" r="1.4" opacity="0.6"/>
    <circle cx="1402" cy="186" r="1.1" opacity="0.5"/>
  </g>
  <rect width="1600" height="1000" filter="url(#clouds)" mask="url(#cloud-bank)"/>
</svg>
