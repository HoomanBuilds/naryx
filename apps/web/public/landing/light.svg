<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1f"/>
      <stop offset="0.55" stop-color="#0d0d10"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <pattern id="tiles" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(-11) skewX(-6)">
      <rect width="120" height="120" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="652" y2="758">
      <stop offset="0" stop-color="#fff8ea" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffe9c4" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a2a" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#ff3b30"/>
      <stop offset="0.36" stop-color="#ffb000"/>
      <stop offset="0.52" stop-color="#e8ff3a"/>
      <stop offset="0.68" stop-color="#2cff9a"/>
      <stop offset="0.84" stop-color="#2a8cff"/>
      <stop offset="1" stop-color="#8a3bff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bounce" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffe6bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="smear" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#floor)"/>
  <rect width="1600" height="1000" fill="url(#tiles)"/>

  <!-- Warm light bouncing off the floor around the sunlit patch -->
  <ellipse cx="760" cy="380" rx="760" ry="520" fill="url(#bounce)"/>

  <!-- Haze in the air along the beam -->
  <path d="M-120 -160H560L1500 1140H760Z" fill="#fff4dc" opacity="0.07" filter="url(#haze)"/>

  <!-- Sunlight through a window grid: 3 by 4 panes, projected onto the floor -->
  <g filter="url(#soft)" transform="matrix(1 0.18 0.55 1 180 -120)" fill="url(#sun)">
    <rect x="0" y="0" width="200" height="170"/>
    <rect x="226" y="0" width="200" height="170"/>
    <rect x="452" y="0" width="200" height="170"/>
    <rect x="0" y="196" width="200" height="170"/>
    <rect x="226" y="196" width="200" height="170"/>
    <rect x="452" y="196" width="200" height="170"/>
    <rect x="0" y="392" width="200" height="170"/>
    <rect x="226" y="392" width="200" height="170"/>
    <rect x="452" y="392" width="200" height="170"/>
    <rect x="0" y="588" width="200" height="170"/>
    <rect x="226" y="588" width="200" height="170"/>
    <rect x="452" y="588" width="200" height="170"/>
  </g>

  <!-- A prism's split light along the beam's edge -->
  <g transform="matrix(1 0.18 0.55 1 180 -120)" opacity="0.55" style="mix-blend-mode: screen">
    <rect x="-70" y="120" width="54" height="560" fill="url(#spectrum)" filter="url(#smear)"/>
  </g>
  <g transform="matrix(1 0.18 0.55 1 180 -120)" opacity="0.35" style="mix-blend-mode: screen">
    <rect x="680" y="-40" width="36" height="300" fill="url(#spectrum)" filter="url(#smear)"/>
  </g>
</svg>
